# docker-compose.yml — Local development stack for Filesystem MCP Server

services:
  filesystem-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: filesystem-mcp
    environment:
      - FILE_BRIDGE_ROOT_PATH=/sandbox
      - FILE_BRIDGE_MAX_FILE_SIZE=10485760
      - FILE_BRIDGE_FOLLOW_SYMLINKS=false
      - FILE_BRIDGE_ALLOW_ABSOLUTE_PATHS=false
      - FILE_BRIDGE_DEFAULT_ENCODING=utf-8
    volumes:
      # Mount local project as sandbox (read-only by default for safety)
      - ./test-sandbox:/sandbox:ro
      # For read-write access, use: ./test-sandbox:/sandbox:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import filesystem_mcp; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Optional: Development container with source mounted for live reload
  filesystem-mcp-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: filesystem-mcp-dev
    environment:
      - FILE_BRIDGE_ROOT_PATH=/sandbox
      - FILE_BRIDGE_MAX_FILE_SIZE=10485760
      - FILE_BRIDGE_FOLLOW_SYMLINKS=false
      - FILE_BRIDGE_ALLOW_ABSOLUTE_PATHS=false
      - FILE_BRIDGE_DEFAULT_ENCODING=utf-8
    volumes:
      - ./src:/app/src:ro
      - ./test-sandbox:/sandbox:rw
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    working_dir: /app
    command: python -m filesystem_mcp.server
    stdin_open: true
    tty: true
    profiles:
      - dev

