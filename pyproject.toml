[project]
name = "filesystem-mcp"
version = "1.0.1"
description = "Bridge your AI assistant to local files — read, write, search, and manage files securely without cloud dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Airgap Fleet", email = "fleet@airgap.io"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=3.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=25.1",
    "watchdog>=4.0",
]

[project.scripts]
filesystem-mcp = "filesystem_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "uv>=0.5",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID", "RUF", "PTH", "ERA", "ARG", "AIR", "DTZ", "FA", "ISC", "ICN", "PIE", "PT", "QF", "TCH", "TRY", "UN", "RET", "ASYNC", "NPY", "PL", "T20", "W", "N", "INP", "S", "BLE"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=filesystem_mcp --cov-fail-under=70 -m \"not integration\""
markers = [
    "integration: marks tests as integration tests requiring filesystem access",
]

[tool.coverage.run]
source = ["filesystem_mcp"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]