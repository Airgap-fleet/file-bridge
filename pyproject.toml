[project]
name = "filesystem-mcp"
version = "1.0.1"
description = "Bridge your AI assistant to local files — read, write, search, and manage files securely without cloud dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AFaaS", email = "dev@afaas.co.uk"}]
keywords = ["bridge", "filesystem", "fastmcp", "stdio", "sse", "http", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=3.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=25.1",
    "watchdog>=4.0",
]

[project.scripts]
filesystem-mcp = "filesystem_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filesystem_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
# Include py.typed marker for PEP 561 compliance
force-include = ["src/filesystem_mcp/py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "RUF", "SIM", "TID", "ARG", "ERA", "PL", "TRY", "NPY", "PERF", "LOG", "PIE", "TD", "DTZ"]
ignore = ["S101", "S106", "PTH207", "TRY003", "PLR2004", "PLC0415", "PLW1510", "SIM102", "F401", "RUF022", "PLW0603", "PLW0603", "PLW0603"]
fixable = ["F", "I", "UP", "B", "C4", "PTH", "RUF", "SIM", "TID", "ARG", "ERA", "PL", "TRY", "NPY", "PERF", "LOG", "PIE", "TD", "DTZ"]
unfixable = ["E", "W", "S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
files = ["filesystem_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=filesystem_mcp --cov-fail-under=70 -m \"not integration\""
markers = [
    "integration: marks tests as integration tests requiring filesystem access",
]

[tool.coverage.run]
source = ["filesystem_mcp"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]